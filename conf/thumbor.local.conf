# Local-test config: same as conf/thumbor.conf but with permissive
# ALLOWED_SOURCES (test fixtures load from external hosts).
# Empty ALLOWED_SOURCES = allow every source (http_loader.validate).

import sys, importlib
sys.path.insert(0, '/etc/thumbor/conf')
_base = importlib.import_module('thumbor_base_conf')
for _k, _v in vars(_base).items():
    if _k.isupper():
        globals()[_k] = _v

ALLOWED_SOURCES = []
LOADER = "thumbor.loaders.http_loader"  # loader reads back from S3 (MinIO)

# Local S3 = MinIO in the compose network.
AWS_STORAGE_S3_ENDPOINT_URL = "http://minio:9000"
AWS_LOADER_S3_ENDPOINT_URL = "http://minio:9000"
AWS_STORAGE_BUCKET_NAME = "thumbor-media"
AWS_LOADER_BUCKET_NAME = "thumbor-media"
AWS_STORAGE_S3_ACCESS_KEY_ID = "minioadmin"
AWS_STORAGE_S3_SECRET_ACCESS_KEY = "minioadmin"
AWS_LOADER_S3_ACCESS_KEY_ID = "minioadmin"
AWS_LOADER_S3_SECRET_ACCESS_KEY = "minioadmin"
AWS_STORAGE_ROOT_PATH = "/media"
AWS_LOADER_ROOT_PATH = "/media"
AWS_DEFAULT_LOCATION = "http://minio:9000/{bucket_name}"
ALLOW_UNSAFE_URL = True

# Result storage cache também no MinIO local.
AWS_RESULT_STORAGE_BUCKET_NAME = "thumbor-media"
AWS_RESULT_STORAGE_ROOT_PATH = "/results"
AWS_RESULT_STORAGE_REGION_NAME = "us-east-1"
AWS_RESULT_STORAGE_S3_ENDPOINT_URL = "http://minio:9000"
AWS_RESULT_STORAGE_S3_ACCESS_KEY_ID = "minioadmin"
AWS_RESULT_STORAGE_S3_SECRET_ACCESS_KEY = "minioadmin"
